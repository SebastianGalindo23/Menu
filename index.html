<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Campestre Grill House — Menú</title>
<style>
  :root{
    --ink:#0F0D0C;
    --char:#1A1512;
    --gold:#E3A83B;
    --fire:#C4291B;
    --cream:#F4ECDD;
    --muted:#B7A98F;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:var(--ink);
    color:var(--cream);
    font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    width:100%;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  button:focus-visible{outline:3px solid var(--fire);outline-offset:2px;}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- HOME / PORTADA ---------- */
  #screen-home{
    position:relative;
    max-width:520px;
    margin:0 auto;
  }
  #screen-home img{
    display:block;width:100%;height:auto;
  }
  .hotspot{
    position:absolute;
    background:rgba(0,0,0,0);
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  /* Coordenadas aproximadas basadas en la imagen 900x1600 */
  .hotspot-desayuno{
    left:2.7%;  top:68.6%;
    width:41%;  height:5.9%;
  }
  .hotspot-almuerzo{
    left:61%;   top:68.6%;
    width:36%;  height:5.9%;
  }
  .hotspot:active{background:rgba(227,168,59,0.18);border-radius:40px;}

  /* ---------- VISOR DE MENÚ ---------- */
  #screen-desayuno, #screen-almuerzo{
    min-height:100vh;
    padding-top:78px;
  }
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 7px),
      linear-gradient(180deg, #2b1d13 0%, #1a1109 100%);
    box-shadow:0 4px 18px rgba(0,0,0,0.5);
    border-bottom:2px solid rgba(227,168,59,0.35);
    padding:16px 18px;
  }
  .topbar::before{
    content:none;
  }
  .topbar .title{
    font-weight:800;color:var(--gold);font-size:1.1rem;
    letter-spacing:0.02em;text-transform:uppercase;
  }
  .home-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--fire);color:var(--cream);
    border:none;border-radius:20px;
    padding:10px 20px;font-size:0.9rem;font-weight:800;
    text-transform:uppercase;letter-spacing:0.02em;
    cursor:pointer;
  }
  .home-btn:hover{background:#a82116;}

  .pages{
    max-width:760px;margin:0 auto;
    display:flex;flex-direction:column;gap:24px;
    padding:20px 14px 24px;
  }
  .zoom-wrap{
    border-radius:10px;
    overflow:auto;
    box-shadow:0 12px 32px rgba(0,0,0,0.45);
    background:#000;
    -webkit-overflow-scrolling:touch;
  }
  .zoom-wrap img{
    display:block;
    width:100%;
    height:auto;
    cursor:zoom-in;
    transition:width .25s ease;
  }
  .zoom-wrap.zoomed{
    overflow:auto;
  }
  .zoom-wrap.zoomed img{
    width:220%;
    max-width:none;
    cursor:zoom-out;
  }
  .zoom-hint{
    text-align:center;
    font-size:0.95rem;font-weight:700;color:var(--ink);
    background:var(--gold);
    border-radius:30px;
    padding:10px 18px;
    margin:0 auto 4px;
    max-width:fit-content;
    display:flex;align-items:center;gap:8px;
  }

  footer{
    background:var(--char);
    padding:20px 0;text-align:center;
    border-top:1px solid rgba(244,236,221,0.1);
  }
  footer .thanks{font-size:1.05rem;font-weight:700;color:var(--gold);margin-bottom:6px;}
  footer .meta{font-size:0.78rem;color:var(--muted);}
</style>
</head>
<body>

<!-- ============ PORTADA ============ -->
<section class="screen active" id="screen-home">
  <img src="assets/portada.jpg" alt="Campestre Grill House — Menús">
  <button class="hotspot hotspot-desayuno" aria-label="Ver menú de desayuno y cena" onclick="showScreen('desayuno')"></button>
  <button class="hotspot hotspot-almuerzo" aria-label="Ver menú de almuerzo" onclick="showScreen('almuerzo')"></button>
</section>

<!-- ============ DESAYUNO ============ -->
<section class="screen" id="screen-desayuno">
  <div class="topbar">
    <span class="title">Desayuno &amp; Cena</span>
    <button class="home-btn" onclick="showScreen('home')">⌂ Inicio</button>
  </div>
  <div class="pages">
    <p class="zoom-hint">🔍 Toca una página para agrandar</p>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/desayuno/pagina-1.jpg" alt="Menú de desayunos - página 1" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/desayuno/pagina-2.jpg" alt="Menú de desayunos - página 2" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/desayuno/pagina-3.jpg" alt="Menú de desayunos - página 3" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/desayuno/pagina-4.jpg" alt="Bebidas y extras" loading="lazy"></div>
  </div>
  <footer>
    <div class="thanks">«Gracias por elegirnos»</div>
    <div class="meta">Campestre Grill House · /CampestreGrillHouse</div>
  </footer>
</section>

<!-- ============ ALMUERZO ============ -->
<section class="screen" id="screen-almuerzo">
  <div class="topbar">
    <span class="title">Almuerzo</span>
    <button class="home-btn" onclick="showScreen('home')">⌂ Inicio</button>
  </div>
  <div class="pages">
    <p class="zoom-hint">🔍 Toca una página para agrandar</p>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-02.jpg" alt="Entradas" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-04.jpg" alt="Parrilladas" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-05.jpg" alt="Asado personal" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-06.jpg" alt="Asado premium" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-07.jpg" alt="Arrechera" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-08.jpg" alt="Mar y tierra" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-09.jpg" alt="Churrascos y tablazo" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-10.jpg" alt="Mariscos" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-11.jpg" alt="Hamburguesas" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-12.jpg" alt="Hamburguesas" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-13.jpg" alt="Panes con carne" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-14.jpg" alt="Antojitos y postres" loading="lazy"></div>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/almuerzo/pagina-15.jpg" alt="Bebidas y copas" loading="lazy"></div>
  </div>
  <footer>
    <div class="thanks">«Gracias por elegirnos»</div>
    <div class="meta">Campestre Grill House · /CampestreGrillHouse</div>
  </footer>
</section>

<script>
  function showScreen(name){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    window.scrollTo({top:0, behavior:'instant'});
  }
  function toggleZoom(wrap){
    wrap.classList.toggle('zoomed');
    if(!wrap.classList.contains('zoomed')){
      wrap.scrollLeft = 0;
      wrap.scrollTop = 0;
    }
  }
</script>

</body>
</html>
